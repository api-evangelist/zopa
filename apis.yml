name: zopa
description: 'Zopa Bank is a UK FCA-authorised, PRA-regulated digital bank offering flexible savings,
  personal loans, credit cards, car finance and the Biscuit current account. As a registered Account Servicing
  Payment Service Provider (ASPSP), Zopa exposes UK Open Banking Read/Write v4.0.0 APIs to authorised
  Third Party Providers: an Account & Transaction API (AIS) for consent-based access to accounts, balances,
  transactions, statements, standing orders, direct debits, beneficiaries and party data, and a Payment
  Initiation API (PIS) for domestic payments and standing orders. Access uses OAuth2 (client-credentials
  for TPPs, authorization-code for PSUs) over mutual TLS with FAPI headers and JWS request signing. Zopa
  was surfaced as a portfolio company of Balderton Capital, Bessemer Venture Partners, HV Capital, Northzone,
  QED Investors and SoftBank Vision Fund.'
